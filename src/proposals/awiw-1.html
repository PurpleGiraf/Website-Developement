document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #ECEAF0;\">\n    <div style=\"display:flex;align-items:center;gap:10px;padding:10px clamp(16px,4vw,32px);\">\n      <a href=\"#top\" style=\"display:block;margin-right:auto;\"><img src=\"f16ea72b-3fe3-4bb0-9575-03b73ebf3770\" alt=\"Purple Giraffe\" style=\"height:40px;width:auto;display:block;\"><\u002Fa>\n      <button type=\"button\" sc-camel-on-click=\"{{ openDrawer }}\" style=\"display:flex;align-items:center;gap:8px;border:1px solid #D5D1DA;background:#FFFFFF;color:#2E1A47;font-weight:600;font-size:14px;padding:9px 14px;border-radius:999px;cursor:pointer;\"><span style=\"display:grid;gap:3px;\"><i style=\"display:block;width:14px;height:1.5px;background:#2E1A47;\"><\u002Fi><i style=\"display:block;width:14px;height:1.5px;background:#2E1A47;\"><\u002Fi><i style=\"display:block;width:10px;height:1.5px;background:#2E1A47;\"><\u002Fi><\u002Fspan>Contents<\u002Fbutton>\n      <a href=\"#accept\" style=\"text-decoration:none;color:#FFFFFF;background:#2E1A47;font-weight:600;font-size:14px;padding:10px 16px;border-radius:999px;white-space:nowrap;\">Accept<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"height:2px;background:#ECEAF0;\"><div style=\"height:2px;background:#6B4E91;width:{{ progressPct }};transition:width .2s linear;\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{ drawer }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeDrawer }}\" style=\"position:fixed;inset:0;z-index:60;background:rgba(46,26,71,.28);animation:fadeUp .2s ease both;\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"position:absolute;left:0;top:0;bottom:0;width:min(320px,86vw);background:#FFFFFF;padding:24px 16px;overflow:auto;display:grid;gap:4px;align-content:start;box-shadow:20px 0 60px -20px rgba(46,26,71,.35);animation:slideIn .3s cubic-bezier(.2,.7,.2,1) both;\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;padding:0 10px 16px;\"><img src=\"f16ea72b-3fe3-4bb0-9575-03b73ebf3770\" alt=\"Purple Giraffe\" style=\"height:48px;width:auto;\"><button type=\"button\" sc-camel-on-click=\"{{ closeDrawer }}\" aria-label=\"Close contents\" style=\"border:0;background:#F3F0F7;width:36px;height:36px;border-radius:50%;cursor:pointer;color:#2E1A47;font-size:18px;\">×<\u002Fbutton><\u002Fdiv>\n        <sc-for list=\"{{ navGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n          <div style=\"display:grid;\">\n            <a href=\"{{ g.href }}\" sc-camel-on-click=\"{{ closeDrawer }}\" style=\"display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;text-decoration:none;color:{{ g.fg }};background:{{ g.bg }};\">\n              <span style=\"width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:{{ g.dotBg }};color:{{ g.dotFg }};\">{{ g.n }}<\u002Fspan>\n              <span style=\"font-weight:600;font-size:15px;\">{{ g.label }}<\u002Fspan>\n            <\u002Fa>\n            <div style=\"display:grid;margin:4px 0 10px 24px;border-left:1px solid #E4E0EA;\">\n              <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"5\">\n                <a href=\"{{ it.href }}\" sc-camel-on-click=\"{{ closeDrawer }}\" style=\"display:block;padding:6px 14px;margin-left:-1px;border-left:2px solid {{ it.bar }};font-size:14px;font-weight:{{ it.fw }};color:{{ it.fg }};text-decoration:none;\">{{ it.label }}<\u002Fa>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fsc-if>\n\n<div id=\"pg-main\">\n\n<header id=\"top\" data-screen-label=\"Cover\" style=\"position:relative;overflow:hidden;background:#FFFFFF;\">\n  <div style=\"max-width:1120px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(20px,4vw,56px) clamp(56px,7vw,88px);display:flex;flex-wrap:wrap;gap:48px;align-items:center;\">\n    <div style=\"flex:1.3 1 420px;display:grid;gap:26px;animation:fadeUp .8s ease both;\">\n      <span style=\"font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#6B4E91;\">Website proposal<\u002Fspan>\n      <h1 style=\"margin:0;font-weight:600;font-size:clamp(40px,5.2vw,70px);line-height:1.04;letter-spacing:-.015em;color:#2E1A47;text-wrap:balance;\">A new website for <span style=\"color:#6B4E91;\">Australian Women in Wine.<\u002Fspan><\u002Fh1>\n      <p style=\"margin:0;max-width:56ch;font-size:clamp(17px,1.4vw,19px);color:#4A4057;text-wrap:pretty;\">You've asked us for a proposal to build a new Australian Women in Wine website, using your existing website copy. Here's what you'll get, how we'll build it, who you'll work with and the investment.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px;\">\n        <a href=\"#thanks\" style=\"display:inline-flex;align-items:center;gap:10px;background:#2E1A47;color:#FFFFFF;text-decoration:none;font-weight:600;padding:14px 24px;border-radius:999px;transition:background .25s,transform .25s;\" style-hover=\"background:#6B4E91;color:#FFFFFF;transform:translateY(-2px);\">Read the proposal <span aria-hidden=\"true\">↓<\u002Fspan><\u002Fa>\n        <a href=\"#recommendation\" style=\"display:inline-flex;align-items:center;color:#2E1A47;text-decoration:none;font-weight:600;padding:14px 22px;border-radius:999px;border:1px solid #D5D1DA;transition:border-color .25s,background .25s;\" style-hover=\"border-color:#2E1A47;background:#F6F4F8;\">See our recommendation<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px 40px;border-top:1px solid #ECEAF0;padding-top:20px;\">\n        <div style=\"display:grid;\"><span style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6E6380;\">Prepared by<\u002Fspan><span style=\"color:#2E1A47;font-weight:600;\">Suba Thiyagarajah<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;\"><span style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6E6380;\">Date<\u002Fspan><span style=\"color:#2E1A47;font-weight:600;\">3 November 2026<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;\"><span style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6E6380;\">Valid until<\u002Fspan><span style=\"color:#2E1A47;font-weight:600;\">3 December 2026<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 340px;align-self:stretch;margin-right:calc(-1 * clamp(20px,4vw,56px));background:#ECEAF0;border-radius:32px 0 0 32px;padding:clamp(28px,4vw,44px);display:grid;gap:20px;align-content:center;animation:fadeUp .9s .15s ease both;\">\n      <img src=\"410a4ecf-00f9-40ee-807f-7270649ca2f2\" alt=\"Australian Women in Wine\" style=\"width:100%;max-width:320px;height:auto;border-radius:8px;display:block;\">\n      <div style=\"background:#FFFFFF;border-radius:24px;padding:28px;display:grid;gap:14px;box-shadow:0 24px 48px -28px rgba(46,26,71,.35);max-width:360px;\"><span style=\"font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#6E6380;\">What we're proposing<\u002Fspan><span style=\"font-size:clamp(30px,3vw,40px);font-weight:600;letter-spacing:-.02em;line-height:1;color:#2E1A47;\">Growth website<\u002Fspan><div style=\"display:grid;gap:8px;border-top:1px solid #ECEAF0;padding-top:14px;font-size:15px;color:#4A4057;\"><span>Custom design<\u002Fspan><span>8 pages on WordPress<\u002Fspan><span>Your existing copy, placed and formatted<\u002Fspan><span>Launch in about 3 weeks<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main>\n<section id=\"thanks\" data-screen-label=\"Introduction\" style=\"scroll-margin-top:70px;padding:clamp(60px,8vw,110px) 0 clamp(80px,10vw,140px);background:#FFFFFF;border-top:1px solid rgba(46,26,71,.06);\">\n  <div style=\"max-width:960px;margin:0 auto;padding:0 clamp(20px,4vw,56px);\">\n    <div data-reveal=\"\" style=\"border-radius:28px;border:1px solid rgba(46,26,71,.08);background:rgba(46,26,71,.02);padding:clamp(28px,5vw,64px);display:grid;gap:22px;\">\n      <span style=\"font-size:12px;letter-spacing:.12em;color:#6B4E91;\">INTRODUCTION<\u002Fspan>\n      <p style=\"margin:0;font-weight:300;font-size:clamp(28px,3.4vw,44px);line-height:1.15;color:#2E1A47;letter-spacing:-.01em;\">Thank you for the opportunity to provide this proposal for Australian Women in Wine's new website.<\u002Fp>\n      <p style=\"margin:0;font-size:18px;font-weight:400;color:#3D3449;\">You've asked us to build a new website for AWIW using your existing website copy. The following pages set out what the new website will give you, how we'll build it, who you'll work with and the investment.<\u002Fp>\n      <div style=\"display:grid;gap:12px;\">\n        <b style=\"font-weight:600;font-size:18px;color:#2E1A47;\">What you can expect from working with Purple Giraffe<\u002Fb>\n        <ul style=\"margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:17px;color:#3D3449;\">\n          <li style=\"display:flex;gap:12px;align-items:baseline;\"><span style=\"width:7px;height:7px;border-radius:50%;background:#6B4E91;flex:none;transform:translateY(-2px);\"><\u002Fspan><span>A small, named team, with Suba and Chloé as your contacts from kickoff to launch.<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px;align-items:baseline;\"><span style=\"width:7px;height:7px;border-radius:50%;background:#6B4E91;flex:none;transform:translateY(-2px);\"><\u002Fspan><span>A fixed price for the build, billed in three stages.<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px;align-items:baseline;\"><span style=\"width:7px;height:7px;border-radius:50%;background:#6B4E91;flex:none;transform:translateY(-2px);\"><\u002Fspan><span>A working website to review, not a mockup, with two design review rounds before we build.<\u002Fspan><\u002Fli>\n          <li :grid;place-items:center;width:40px;height:40px;border-radius:12px;background:rgba(107,78,145,.14);color:#6B4E91;font-size:13px;\">04<\u002Fspan><h3 style=\"margin:0;font-weight:600;font-size:19px;\">Build and review<\u002Fh3><p style=\"margin:0;font-size:14px;color:#5E5470;\">Built on a staging site. You review the working site, not a mockup.<\u002Fp><p style=\"margin:0;font-size:13px;color:#6B4E91;border-top:1px solid rgba(46,26,71,.07);padding-top:10px;\">AWIW: schema, forms, migration and redirect testing.<\u002Fp><\u002Fdiv>\n      <div data-reveal=\"320\" style=\"border-radius:22px;border:1px solid rgba(46,26,71,.08);padding:26px;display:grid;gap:12px;align-content:start;background:rgba(46,26,71,.02);transition:transform .4s cubic-bezier(.2,.7,.2,1),border-color .4s,background .4s;\" style-hover=\"transform:translateY(-6px);border-color:rgba(107,78,145,.5);background:rgba(107,78,145,.06);\"><span style=\"display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:rgba(107,78,145,.14);color:#6B4E91;font-size:13px;\">05<\u002Fspan><h3 style=\"margin:0;font-weight:600;font-size:19px;\">Launch and handover<\u002Fh3><p style=\"margin:0;font-size:14px;color:#5E5470;\">Real-device testing, go-live, live checks within 48 hours, recorded training, 30 days of fixes.<\u002Fp><p style=\"margin:0;font-size:13px;color:#6B4E91;border-top:1px solid rgba(46,26,71,.07);padding-top:10px;\">AWIW: monitoring, AI re-test, team training.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin-top:40px;\">\n      <div data-reveal=\"\" style=\"border-radius:20px;padding:24px;background:rgba(46,26,71,.025);display:grid;gap:6px;\"><span style=\"font-size:28px;font-weight:600;letter-spacing:-.02em;color:#6B4E91;\">SEO<\u002Fspan><span style=\"font-size:11px;color:#6E6380;\">SEARCH ENGINE OPTIMISATION<\u002Fspan><span style=\"font-size:15px;color:#3D3449;\">Helping you rank in Google and Bing.<\u002Fspan><\u002Fdiv>\n      <div data-reveal=\"80\" style=\"border-radius:20px;padding:24px;background:rgba(46,26,71,.025);display:grid;gap:6px;\"><span style=\"font-size:28px;font-weight:600;letter-spacing:-.02em;color:#6B4E91;\">GEO<\u002Fspan><span style=\"font-size:11px;color:#6E6380;\">GENERATIVE ENGINE OPTIMISATION<\u002Fspan><span style=\"font-size:15px;color:#3D3449;\">Helping ChatGPT, Perplexity and Google AI Overviews understand, reference and recommend you.<\u002Fspan><\u002Fdiv>\n      <div data-reveal=\"160\" style=\"border-radius:20px;padding:24px;background:rgba(46,26,71,.025);display:grid;gap:6px;\"><span style=\"font-size:28px;font-weight:600;letter-spacing:-.02em;color:#1F7A55;\">AEO<\u002Fspan><span style=\"font-size:11px;color:#6E6380;\">ANSWER ENGINE OPTIMISATION<\u002Fspan><span style=\"font-size:15px;color:#3D3449;\">Structuring content to directly answer the questions members, partners and media ask.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:20px 0 0;font-size:13px;color:#6E6380;\">We use AI tools to help with research, drafting and building, and our team reviews and approves everything before you see it.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"why\" data-screen-label=\"3.8 Why Purple Giraffe\" style=\"scroll-margin-top:70px;padding:clamp(64px,8vw,112px) 0;background:#F8F5FA;border-top:1px solid rgba(46,26,71,.06);\">\n  <div style=\"max-width:1120px;margin:0 auto;padding:0 clamp(20px,4vw,56px);\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:40px 72px;align-items:end;margin-bottom:48px;\">\n      <div data-reveal=\"\" style=\"flex:1 1 400px;display:grid;gap:18px;\">\n        <span style=\"font-size:12px;letter-spacing:.12em;color:#6B4E91;\">01.5 · WHY PURPLE GIRAFFE<\u002Fspan>\n        <h2 style=\"margin:0;font-weight:600;font-size:clamp(34px,4.6vw,64px);line-height:1;letter-spacing:-.02em;color:#2E1A47;\">A website with a <span style=\"color:#6B4E91;\">marketing team<\u002Fspan> behind it<\u002Fh2>\n      <\u002Fdiv>\n      <p data-reveal=\"120\" style=\"flex:1.2 1 420px;margin:0;font-size:16px;color:#5E5470;\">Purple Giraffe was founded in 2014 when marketing expert Lynda Schenk saw the growing need for outsourced marketing consultants. Now with offices in South Australia, Western Australia and Queensland, Purple Giraffe offers end-to-end outsourced marketing consulting services to our clients. We're strategically driven, and we adapt our offering to suit each client's needs, with their specific target market in mind.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;\">\n      <div data-reveal=\"\" data-spot=\"\" style=\"border-radius:22px;border:1px solid rgba(46,26,71,.08);padding:26px;display:grid;gap:10px;align-content:start;background:#FFFFFF;\"><span style=\"font-size:12px;color:#6B4E91;\">01<\u002Fspan><b style=\"font-weight:600;font-size:18px;\">Marketing team behind it<\u002Fb><span style=\"font-size:14px;color:#5E5470;\">Planned and written by marketing consultants who understand your audience, not just developers.<\u002Fspan><\u002Fdiv>\n      <div data-reveal=\"80\" data-spot=\"\" style=\"border-radius:22px;border:1px solid rgba(46,26,71,.08);padding:26px;display:grid;gap:10px;align-content:start;background:#FFFFFF;\"><span style=\"font-size:12px;color:#6B4E91;\">02<\u002Fspan><b style=\"font-weight:600;font-size:18px;\">Found on Google and in AI search<\u002Fb><span style=\"font-size:14px;color:#5E5470;\">Every page is written for SEO, GEO and AEO, so it can rank on Google and be referenced by tools like ChatGPT.<\u002Fspan><\u002Fdiv>\n      <div data-reveal=\"160\" data-spot=\"\" style=\"border-radius:22px;border:1px solid rgba(46,26,71,.08);padding:26px;display:grid;gap:10px;align-content:start;background:#FFFFFF;\"><span style=\"font-size:12px;color:#6B4E91;\">03<\u002Fspan><b style=\"font-weight:600;font-size:18px;\">Tracking from day one<\u002Fb><span style=\"font-size:14px;color:#5E5470;\">Analytics, Tag Manager, Search Console and conversion tracking set up before launch.<\u002Fspan><\u002Fdiv>\n      <div data-reveal=\"240\" data-spot=\"\" style=\"border-radius:22px;border:1px solid rgba(46,26,71,.08);padding:26px;display:grid;gap:10px;align-content:start;background:#FFFFFF;\"><span style=\"font-size:12px;color:#6B4E91;\">04<\u002Fspan><b style=\"font-weight:600;font-size:18px;\">Looked after after launch<\u002Fb><span style=\"font-size:14px;color:#5E5470;\">We host, maintain and keep improving it, or hand it over with recorded training.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"\" style=\"margin-top:12px;border-radius:28px;border:1px solid rgba(46,26,71,.08);background:#F3F0F7;padding:clamp(28px,4vw,48px);display:flex;flex-wrap:wrap;gap:32px 56px;align-items:center;\">\n      <div style=\"flex:1 1 280px;display:grid;gap:6px;\"><span data-count=\"164\" style=\"font-weight:300;font-size:clamp(96px,11vw,150px);line-height:.8;letter-spacing:-.03em;color:#2E1A47;\">164<\u002Fspan><span style=\"font-size:16px;color:#3D3449;\">Our team members have a minimum combined 164 years' experience in marketing.<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:1.4 1 380px;display:grid;gap:12px;\">\n        <span style=\"font-size:11px;color:#6E6380;\">WE PARTNER WITH YOU TO<\u002Fspan>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n          <span style=\"padding:9px 16px;border-radius:999px;border:1px solid rgba(46,26,71,.14);font-size:14px;transition:background .3s,border-color .3s;\" style-hover=\"background:rgba(46,26,71,.08);border-color:rgba(46,26,71,.3);\">Reach your goals<\u002Fspan>\n          <span style=\"padding:9px 16px;border-radius:999px;border:1px solid rgba(46,26,71,.14);font-size:14px;transition:background .3s,border-color .3s;\" style-hover=\"background:rgba(46,26,71,.08);border-color:rgba(46,26,71,.3);\">Save costs<\u002Fspan>\n          <span s
